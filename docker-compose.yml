name: crownd-local

x-app-environment: &app-environment
  APP_ENV: ${APP_ENV:-development}
  LOG_LEVEL: ${LOG_LEVEL:-INFO}
  DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-crownd}:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in the ignored .env file}@db:5432/${POSTGRES_DB:-crownd}?sslmode=disable
  JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in the ignored .env file}
  CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:8080}
  FRONTEND_BASE_URL: ${FRONTEND_BASE_URL:-http://localhost:8080}
  TRUSTED_HOSTS: ${TRUSTED_HOSTS:-localhost,127.0.0.1,::1}
  TRUSTED_PROXY_IPS: ${TRUSTED_PROXY_IPS:-172.28.240.10}
  FORWARDED_ALLOW_IPS: ${FORWARDED_ALLOW_IPS:-172.28.240.10}
  COOKIE_SECURE: ${COOKIE_SECURE:-false}
  COOKIE_SAMESITE: ${COOKIE_SAMESITE:-lax}
  COOKIE_DOMAIN: ${COOKIE_DOMAIN:-}
  RATE_LIMIT_ENABLED: ${RATE_LIMIT_ENABLED:-true}
  RATE_LIMIT_STORAGE_URI: ${RATE_LIMIT_STORAGE_URI:-memory://}
  EMAIL_MODE: ${EMAIL_MODE:-disabled}
  EMAIL_FROM: ${EMAIL_FROM:-CROWND <no-reply@localhost>}
  SMTP_HOST: ${SMTP_HOST:-mailpit}
  SMTP_PORT: ${SMTP_PORT:-1025}
  SMTP_USERNAME: ${SMTP_USERNAME:-}
  SMTP_PASSWORD: ${SMTP_PASSWORD:-}
  SMTP_STARTTLS: ${SMTP_STARTTLS:-false}
  SMTP_TIMEOUT_SECONDS: ${SMTP_TIMEOUT_SECONDS:-10}
  DB_POOL_SIZE: ${DB_POOL_SIZE:-5}
  DB_MAX_OVERFLOW: ${DB_MAX_OVERFLOW:-5}
  DB_POOL_TIMEOUT_SECONDS: ${DB_POOL_TIMEOUT_SECONDS:-15}
  DB_POOL_RECYCLE_SECONDS: ${DB_POOL_RECYCLE_SECONDS:-1800}
  DB_CONNECT_TIMEOUT_SECONDS: ${DB_CONNECT_TIMEOUT_SECONDS:-5}
  WORKER_HEARTBEAT_FILE: ${WORKER_HEARTBEAT_FILE:-/tmp/crownd-worker-heartbeat}

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-crownd}
      POSTGRES_USER: ${POSTGRES_USER:-crownd}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in the ignored .env file}
    volumes:
      - crownd-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s
    restart: unless-stopped
    networks: [app]

  migrate:
    build:
      context: ./backend
    environment: *app-environment
    command: ["alembic", "upgrade", "head"]
    depends_on:
      db:
        condition: service_healthy
    restart: "no"
    networks: [app]

  api:
    build:
      context: ./backend
    environment: *app-environment
    expose: ["8000"]
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/v1/health/ready', timeout=3).read()"]
      interval: 20s
      timeout: 5s
      retries: 3
      start_period: 20s
    restart: unless-stopped
    stop_grace_period: 30s
    networks: [app]

  notification-worker:
    build:
      context: ./backend
    command: ["python", "-m", "app.worker"]
    environment:
      <<: *app-environment
      DB_POOL_SIZE: 2
      DB_MAX_OVERFLOW: 0
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "-c", "import os,sys,time; p=os.getenv('WORKER_HEARTBEAT_FILE','/tmp/crownd-worker-heartbeat'); sys.exit(0 if os.path.isfile(p) and time.time()-os.path.getmtime(p)<30 else 1)"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 15s
    restart: unless-stopped
    stop_grace_period: 30s
    networks: [app]

  web:
    build:
      context: ./frontend
      args:
        VITE_API_URL: /api/v1
    ports:
      - "${WEB_BIND_ADDRESS:-127.0.0.1}:${WEB_PORT:-8080}:8080"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8080/healthz || exit 1"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 5s
    restart: unless-stopped
    stop_grace_period: 15s
    networks:
      app:
        ipv4_address: 172.28.240.10

  mailpit:
    image: axllent/mailpit:v1.27
    profiles: [dev-mail]
    ports:
      - "127.0.0.1:8025:8025"
    expose: ["1025"]
    restart: unless-stopped
    networks: [app]

volumes:
  crownd-postgres:

networks:
  app:
    driver: bridge
    ipam:
      config:
        - subnet: 172.28.240.0/24
