services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: crownd
      POSTGRES_USER: crownd
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-local-only-change-me}
    volumes: [crownd-postgres:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U crownd -d crownd"]
      interval: 5s
      timeout: 5s
      retries: 10
  mailpit:
    image: axllent/mailpit:v1.27
    ports: ["8025:8025"]
    expose: ["1025"]
  api:
    build: ./backend
    environment:
      DATABASE_URL: postgresql+psycopg://crownd:${POSTGRES_PASSWORD:-local-only-change-me}@db:5432/crownd
      JWT_SECRET: ${JWT_SECRET:-development-only-change-me}
      APP_ENV: ${APP_ENV:-development}
      PAYMENT_MODE: ${PAYMENT_MODE:-simulator}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:8080}
      FRONTEND_BASE_URL: ${FRONTEND_BASE_URL:-http://localhost:8080}
      TRUSTED_PROXY_IPS: ${TRUSTED_PROXY_IPS:-172.16.0.0/12,127.0.0.1,::1}
      RATE_LIMIT_STORAGE_URI: ${RATE_LIMIT_STORAGE_URI:-memory://}
      EMAIL_MODE: ${EMAIL_MODE:-smtp}
      EMAIL_FROM: ${EMAIL_FROM:-CROWND <no-reply@localhost>}
      SMTP_HOST: ${SMTP_HOST:-mailpit}
      SMTP_PORT: ${SMTP_PORT:-1025}
      SMTP_STARTTLS: ${SMTP_STARTTLS:-false}
    ports: ["8000:8000"]
    depends_on:
      db: {condition: service_healthy}
      mailpit: {condition: service_started}
  web:
    build: ./frontend
    ports: ["8080:80"]
    depends_on: [api]
volumes:
  crownd-postgres:
